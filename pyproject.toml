[project]
name = "single-cell-analysis"
version = "0.1.0"
description = "Production-grade single-cell analysis pipeline for GSE235063 with debug mode support"
readme = "README.md"
requires-python = ">=3.10.2"
dependencies = [
    "cellbender>=0.3.0",
    "celltypist>=1.7.1",
    "doubletdetection>=4.3.0.post1",
    "matplotlib>=3.10.3",
    "nextflow>=25.4.6",
    "numpy>=2.2.6",
    "pandas>=2.3.1",
    "ray[tune]>=2.47.1",
    "scanpy>=1.11.3",
    "scipy>=1.15.3",
    "scvi-tools>=1.3.2",
    "seaborn>=0.13.2",
]
